name: PatternDetected
publisher: Pattern
consumers:
- Strategy
- Dashboard
version: 1
compatibility: additive
description: Chart or candlestick pattern detected
payload:
  symbol: string
  pattern_id: string
  confidence: float
  bar_index: integer
schema:
  type: object
  required:
  - symbol
  - pattern_id
  - confidence
  - bar_index
  properties:
    symbol:
      type: string
    pattern_id:
      type: string
    confidence:
      type: number
    bar_index:
      type: integer
