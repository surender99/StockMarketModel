name: SignalGenerated
publisher: Strategy
consumers:
- Backtest
- PaperTrading
version: 1
compatibility: additive
description: Trade signal emitted by strategy engine
payload:
  strategy_id: string
  symbol: string
  direction: string
  strength: float
schema:
  type: object
  required:
  - strategy_id
  - symbol
  - direction
  - strength
  properties:
    strategy_id:
      type: string
    symbol:
      type: string
    direction:
      type: string
    strength:
      type: number
