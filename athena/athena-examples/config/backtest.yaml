backtest:
  initial_capital: 1000000
  currency: INR
  costs:
    brokerage_pct: 0.0003
    brokerage_flat: 20
    slippage_pct: 0.001
    stt_pct: 0.001
    gst_on_brokerage_pct: 0.18
  benchmark: ^NSEI
  fill_price: close
  allow_fractional: false

experiment_tracking:
  base_path: ./experiments
  auto_capture_git: true
  compare_metrics:
    - total_return
    - cagr
    - max_drawdown
    - sharpe
    - win_rate
    - trade_count

regime:
  benchmark_symbol: ^NSEI
  ema_fast_period: 50
  ema_slow_period: 200
  adx_period: 14
  adx_sideways_threshold: 20
  atr_period: 14
  rolling_vol_window: 20
  vol_high_percentile: 0.75
  vol_lookback_days: 252

scanner:
  top_n: 20
  min_score: 0.0
  weights:
    breakout: 0.25
    relative_strength: 0.25
    momentum: 0.25
    signal_probability: 0.25
  breakout_lookback_days: 252
  momentum_lookback_days: 20
  rs_lookback_days: 63
  benchmark_symbol: ^NSEI

walk_forward:
  train_days: 252
  test_days: 63
  step_days: 63
  mode: rolling
  min_train_days: 126

optimizer:
  method: grid
  max_trials: 50
  random_seed: 42
  parameters:
    - path: risk.stop_loss_pct
      type: choice
      values: [0.03, 0.05, 0.07]
    - path: risk.take_profit_pct
      type: choice
      values: [0.10, 0.15, 0.20]
  objectives:
    - sharpe
    - max_drawdown
    - profit_factor
  objective_weights:
    sharpe: 0.4
    max_drawdown: 0.3
    profit_factor: 0.3

ml_scorer:
  enabled: false
  model_type: logistic
  min_training_samples: 20
  use_heuristic_fallback: true

explainability:
  enabled: true
  top_features: 3

data_ingest:
  base_path: ./data/ohlcv

feature_store:
  base_path: ./data/features
  data_version: v1
