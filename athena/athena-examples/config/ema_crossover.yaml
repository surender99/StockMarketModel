strategy:
  id: ema_crossover_v1
  version: "1.0.0"
  description: Golden cross EMA 50/200 on NIFTY 500 sample

universe:
  source: nifty500
  symbols: []

indicators:
  - id: ema_fast
    type: ema
    params: { period: 50 }
  - id: ema_slow
    type: ema
    params: { period: 200 }

entry:
  rules:
    - condition: "ema_fast > ema_slow and ema_fast.shift(1) <= ema_slow.shift(1)"
      side: long

exit:
  rules:
    - condition: "ema_fast < ema_slow"
      reason: signal_reversal

filters:
  - type: min_volume
    params: { min_avg_volume_20d: 100000 }

position_sizing:
  method: fixed_fraction
  params: { fraction: 0.05, max_positions: 10 }

risk:
  stop_loss_pct: 0.05
  take_profit_pct: 0.15
  max_holding_days: 60
