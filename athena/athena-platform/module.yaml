name: athena-platform
owner: platform-team
bounded_context: platform
version: "0.1.0"
description: Executable product assembly and production runtime
dependencies:
  packages:
    - athena-os
    - athena-common
    - athena-core
    - athena-domain
    - athena-data
    - athena-indicators
    - athena-patterns
    - athena-strategies
    - athena-risk
    - athena-portfolio
    - athena-execution
events:
  publishes:
    - SecurityAudit
  consumes:
    - SimulationOrder
    - PortfolioRebalanced
interfaces:
  - athena_platform.bootstrap
api:
  modules:
    - athena_platform.bootstrap
    - athena_platform.runtime
  openapi: null
database:
  schemas: []
quality:
  fitness_tests: true
  min_coverage: 0.0
