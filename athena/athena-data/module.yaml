name: athena-data
owner: data-team
bounded_context: data
version: "0.1.0"
description: Data pipeline bounded context
dependencies:
  packages:
    - athena-os
    - athena-common
    - athena-core
events:
  publishes:
    - DataValidated
    - IngestCompleted
    - IngestFailed
  consumes: []
interfaces:
  - athena_domain.contracts.protocols.DataProvider
api:
  modules:
    - athena_data
  openapi: null
database:
  schemas:
    - ohlcv
    - instruments
quality:
  fitness_tests: true
  min_coverage: 0.0
