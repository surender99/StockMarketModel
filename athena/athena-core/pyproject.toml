[project]
name = "athena-core"
version = "0.1.0"
description = "Athena quantitative research platform — core library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Athena Contributors" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "shap>=0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "pandas-ta-classic>=0.3.14; python_version<'3.12'",
    "pandas-ta>=0.4.67b0; python_version>='3.12'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: live network tests (yfinance)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["athena_core"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas_ta.*", "sklearn.*", "shap.*"]
ignore_missing_imports = true

[project.scripts]
athena-core = "athena_core.interfaces.cli:main"
