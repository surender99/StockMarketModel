repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
        files: ^athena/(athena-core|athena-sdk|athena-ai|athena-cli|athena-dashboard)/
      - id: ruff-format
        files: ^athena/(athena-core|athena-sdk|athena-ai|athena-cli|athena-dashboard)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.6
          - structlog>=24.1
          - types-PyYAML>=6.0
          - pandas-stubs>=2.2
        files: ^athena/athena-core/src/
